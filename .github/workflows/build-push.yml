name: Android CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web & Sync Capacitor
        run: npm run cap:sync

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}" --stacktrace

      - name: Verify APK Output
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Smart Closet Stylist v1.0.${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          body: |
            ## 📱 스마트 옷장 & 코디 (Smart Closet Stylist) APK 다운로드
            
            스마트폰 카메라로 아래 **QR 코드**를 스캔하시면 APK 최신 버전이 즉시 다운로드됩니다!
            
            ![Release QR Code](https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https%3A%2F%2Fgithub.com%2F${{ github.repository }}%2Freleases%2Fdownload%2Fv1.0.${{ github.run_number }}%2Fapp-debug.apk)
            
            - 📥 **직접 다운로드 링크**: [app-debug.apk 다운로드](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/app-debug.apk)
            - 🔢 **버전 코드**: ${{ github.run_number }} (v1.0.${{ github.run_number }})
            - 🔑 **서명**: 고정 Debug Keystore (기존 앱 덮어쓰기 업데이트 지원)
            - 📌 **커밋**: `${{ github.sha }}`
            
            > **안드로이드 설치 안내**:
            > 1. 다운로드 완료 후 알림창의 `app-debug.apk` 파일 클릭
            > 2. '출처를 알 수 없는 앱 설치' 설정 팝업이 뜨면 **허용**으로 변경 후 설치 진행

      - name: Generate QR Code & Step Summary
        run: |
          sudo apt-get install -y qrencode
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/app-debug.apk"
          
          echo "=========================================="
          echo "APK DOWNLOAD URL: $DOWNLOAD_URL"
          echo "=========================================="
          qrencode -t ANSIUTF8 "$DOWNLOAD_URL"
          
          echo "## 📱 Smart Closet Stylist APK Release v1.0.${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "스마트폰 카메라로 아래 QR 코드를 스캔하여 APK를 즉시 다운로드하세요:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "![Release QR Code](https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https%3A%2F%2Fgithub.com%2F${{ github.repository }}%2Freleases%2Fdownload%2Fv1.0.${{ github.run_number }}%2Fapp-debug.apk)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[📥 **Direct APK Download Link**]($DOWNLOAD_URL)" >> $GITHUB_STEP_SUMMARY
