name: Android CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Capacitor Sync
        run: npm run cap:sync

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

      - name: Generate QR Code & Step Summary
        run: |
          sudo apt-get install -y qrencode
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-debug.apk"
          echo "=========================================="
          echo "APK DOWNLOAD URL: $DOWNLOAD_URL"
          echo "=========================================="
          qrencode -t ANSIUTF8 "$DOWNLOAD_URL"
          
          echo "## 📱 SmartCloset APK Release v${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "Scan the QR code below with your phone camera to download the APK directly:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "![Release QR Code](https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=$DOWNLOAD_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[📥 **Direct APK Download Link**]($DOWNLOAD_URL)" >> $GITHUB_STEP_SUMMARY
